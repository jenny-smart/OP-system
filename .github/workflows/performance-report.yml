name: Daily Performance Report

run-name: ${{ inputs.scheduled_slot && format('cloud-{0}', inputs.scheduled_slot) || github.workflow }}

# 2026-11-26：改跑 tool-system 同一套業績報表（tools/scheduled_daily/performance_report.py），
# 產出的 dashboard_data 用 op_data_sync.py 推到 op-system 與 tool-system（需 secret TOOL_SYSTEM_SYNC_TOKEN），
# 兩邊業績報表數字一致；tool-system 的業績報表排程（performance_report）可以停用。

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      scheduled_slot:
        description: tool-system Cloud Schedule Router slot (leave blank for manual runs)
        required: false
        type: string
        default: ''
  # 備援 cron：排程已併到 tool-system 主控表「排程設定」的 op_performance_report（台北 00:20／08:10／18:10，
  # 由 Router 派送）。本 repo 設 repository variable EXTERNAL_SCHEDULER_ENABLED=true 後，這三個 cron 會略過。
  schedule:
    - cron: '7 0 * * *'    # 台北 08:07
    - cron: '7 10 * * *'   # 台北 18:07
    - cron: '15 16 * * *'  # 台北 00:15

concurrency:
  group: op-performance-report
  cancel-in-progress: false

jobs:
  run-performance-report:
    if: github.event_name != 'schedule' || vars.EXTERNAL_SCHEDULER_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Taipei
      PYTHONPATH: ${{ github.workspace }}
      PERFORMANCE_REPORT_STRICT_ACCOUNTS: "true"
      PERFORMANCE_REPORT_EMAIL_REQUIRED: "false"
      TAIPEI_EMAIL: ${{ secrets.TAIPEI_EMAIL }}
      TAIPEI_PASSWORD: ${{ secrets.TAIPEI_PASSWORD }}
      TAICHUNG_EMAIL: ${{ secrets.TAICHUNG_EMAIL }}
      TAICHUNG_PASSWORD: ${{ secrets.TAICHUNG_PASSWORD }}
      TAOYUAN_EMAIL: ${{ secrets.TAOYUAN_EMAIL }}
      TAOYUAN_PASSWORD: ${{ secrets.TAOYUAN_PASSWORD }}
      HSINCHU_EMAIL: ${{ secrets.HSINCHU_EMAIL }}
      HSINCHU_PASSWORD: ${{ secrets.HSINCHU_PASSWORD }}
      KAOHSIUNG_EMAIL: ${{ secrets.KAOHSIUNG_EMAIL }}
      KAOHSIUNG_PASSWORD: ${{ secrets.KAOHSIUNG_PASSWORD }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      NOTIFY_PASSWORD: ${{ secrets.NOTIFY_PASSWORD }}
      NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
      TOOL_SYSTEM_SYNC_TOKEN: ${{ secrets.TOOL_SYSTEM_SYNC_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run performance report
        # 跟 app「更新全部報表」同一支（含次次月、次次次月、保留單）。
        # 2026-11-26：業績報表排程改由 op-system 負責，第二個參數 true＝寄信（沒設寄信 secrets 會自動略過寄信）。
        run: python -u tools/scheduled_daily/performance_report.py schedule true

      - name: Sync data to op-system and tool-system
        # 2026-11-26：資料同時推到 op-system 與 tool-system（op_data_sync.py），兩邊業績報表數字一致。
        run: python op_data_sync.py jenny-smart/op-system jenny-smart/tool-system
