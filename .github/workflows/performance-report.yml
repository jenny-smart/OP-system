name: Daily Performance Report

run-name: ${{ inputs.scheduled_slot && format('cloud-{0}', inputs.scheduled_slot) || github.workflow }}

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      scheduled_slot:
        description: tool-system Cloud Schedule Router slot (leave blank for manual runs)
        required: false
        type: string
        default: ''
      check_only:
        description: Verify private History access without generating a report
        type: boolean
        default: false
  # 備援 cron：排程已併到 tool-system 主控表「排程設定」的 op_performance_report（台北 00:20／08:10／18:10，
  # 由 Router 派送）。本 repo 設 repository variable EXTERNAL_SCHEDULER_ENABLED=true 後，這三個 cron 會略過。
  schedule:
    - cron: '7 0 * * *'    # 台北 08:07
    - cron: '7 10 * * *'   # 台北 18:07
    - cron: '15 16 * * *'  # 台北 00:15

jobs:
  run-performance-report:
    if: github.event_name != 'schedule' || vars.EXTERNAL_SCHEDULER_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Taipei
      OP_HISTORY_BACKEND: google_sheets
      OP_HISTORY_SPREADSHEET_ID: ${{ secrets.OP_HISTORY_SPREADSHEET_ID }}
      OP_HISTORY_GOOGLE_CREDENTIALS_JSON: ${{ secrets.OP_HISTORY_GOOGLE_CREDENTIALS_JSON || secrets.GOOGLE_SERVICE_ACCOUNT }}
      TAIPEI_EMAIL: ${{ secrets.TAIPEI_EMAIL }}
      TAIPEI_PASSWORD: ${{ secrets.TAIPEI_PASSWORD }}
      TAICHUNG_EMAIL: ${{ secrets.TAICHUNG_EMAIL }}
      TAICHUNG_PASSWORD: ${{ secrets.TAICHUNG_PASSWORD }}
      TAOYUAN_EMAIL: ${{ secrets.TAOYUAN_EMAIL }}
      TAOYUAN_PASSWORD: ${{ secrets.TAOYUAN_PASSWORD }}
      HSINCHU_EMAIL: ${{ secrets.HSINCHU_EMAIL }}
      HSINCHU_PASSWORD: ${{ secrets.HSINCHU_PASSWORD }}
      KAOHSIUNG_EMAIL: ${{ secrets.KAOHSIUNG_EMAIL }}
      KAOHSIUNG_PASSWORD: ${{ secrets.KAOHSIUNG_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Debug trigger
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "UTC:"
          date -u
          echo "Taipei:"
          TZ=Asia/Taipei date

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify private History
        run: |
          python - <<'PY'
          from op_history_store import verify_history

          try:
              verify_history()
          except Exception as exc:
              raise SystemExit(str(exc) if isinstance(exc, RuntimeError) else "OP private History check failed.") from None
          print("Verified private History access and all five periods.")
          PY

      - name: Ensure performance report folder exists
        if: ${{ !inputs.check_only }}
        run: |
          python - <<'PY'
          from paths import PATH_REPORT

          PATH_REPORT.mkdir(parents=True, exist_ok=True)
          print("OK:", PATH_REPORT)
          PY

      - name: Run performance report
        if: ${{ !inputs.check_only }}
        run: |
          if ! python performance_report.py schedule false > /dev/null 2>&1; then
            echo "::error::OP report failed before recording a successful update."
            exit 1
          fi
          echo "OP report completed."
