name: Daily Performance Report

run-name: ${{ inputs.scheduled_slot && format('cloud-{0}', inputs.scheduled_slot) || github.workflow }}

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      scheduled_slot:
        description: tool-system Cloud Schedule Router slot (leave blank for manual runs)
        required: false
        type: string
        default: ''
  # 備援 cron：排程已併到 tool-system 主控表「排程設定」的 op_performance_report（台北 00:20／08:10／18:10，
  # 由 Router 派送）。本 repo 設 repository variable EXTERNAL_SCHEDULER_ENABLED=true 後，這三個 cron 會略過。
  schedule:
    - cron: '7 0 * * *'    # 台北 08:07
    - cron: '7 10 * * *'   # 台北 18:07
    - cron: '15 16 * * *'  # 台北 00:15

jobs:
  run-performance-report:
    if: github.event_name != 'schedule' || vars.EXTERNAL_SCHEDULER_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Taipei
      TAIPEI_EMAIL: ${{ secrets.TAIPEI_EMAIL }}
      TAIPEI_PASSWORD: ${{ secrets.TAIPEI_PASSWORD }}
      TAICHUNG_EMAIL: ${{ secrets.TAICHUNG_EMAIL }}
      TAICHUNG_PASSWORD: ${{ secrets.TAICHUNG_PASSWORD }}
      TAOYUAN_EMAIL: ${{ secrets.TAOYUAN_EMAIL }}
      TAOYUAN_PASSWORD: ${{ secrets.TAOYUAN_PASSWORD }}
      HSINCHU_EMAIL: ${{ secrets.HSINCHU_EMAIL }}
      HSINCHU_PASSWORD: ${{ secrets.HSINCHU_PASSWORD }}
      KAOHSIUNG_EMAIL: ${{ secrets.KAOHSIUNG_EMAIL }}
      KAOHSIUNG_PASSWORD: ${{ secrets.KAOHSIUNG_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Debug trigger
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "UTC:"
          date -u
          echo "Taipei:"
          TZ=Asia/Taipei date

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml streamlit

      - name: Ensure performance report folder exists
        run: |
          python - <<'PY'
          from paths import PATH_REPORT

          PATH_REPORT.mkdir(parents=True, exist_ok=True)
          print("OK:", PATH_REPORT)
          PY

      - name: Run performance report
        run: |
          python performance_report.py schedule false

      - name: Show generated dashboard files
        run: |
          echo "pwd=$(pwd)"
          find dashboard_data -maxdepth 3 -type f | sort || true
          ls -la dashboard_data || true
          ls -la dashboard_data/latest || true

      - name: Upload generated files
        uses: actions/upload-artifact@v6
        with:
          name: performance-report-output
          path: |
            dashboard_data
          if-no-files-found: warn
          compression-level: 6

      - name: Commit and push dashboard data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data
          git status
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "update dashboard data"
          git push origin HEAD:main
